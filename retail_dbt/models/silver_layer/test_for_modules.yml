version: 2

models:
  - name: customer_silver
    description: "Cleaned customer master table"

    columns:
      - name: customer_id
        tests:
          - not_null
          - unique

      - name: email
        tests:
          - not_null
          - unique
          - valid_email: 
              config:
                severity: warn
    
  - name: orders_silver
    description: "Cleaned orders  table"   

    columns:
        - name: order_id
          tests:
            - not_null
            - unique
            
        - name: order_status
          tests:
            - accepted_values:
                arguments:    
                  values: ['COMPLETE','PENDING','CANCELLED']
                config:
                    severity: warn

  - name: orders_item_silver
    columns:
      - name: order_item_id
        tests:
          - not_null
          - unique
      - name: product_id
        tests:
          - not_null
      - name : order_id
        tests:
          - not_null

      - name: quantity
        tests:
          - positive_test

      - name: total_cost
        tests:
          - positive_test

      - name : unit_price
        tests:
          - positive_test
  
  -  name : products_silver
     columns: 
      - name: product_id
        tests:
          - not_null
          - unique
      - name : category_id
        tests:
          - not_null
      
      - name: price
        tests:
          - positive_test:
                config:
                    severity: warn

  - name: payments_silver
    columns: 
      - name : payment_id
        tests:
          - not_null
          - unique

  - name: stores_silver
    columns: 
      - name : store_id
        tests:
          - not_null
          - unique

      - name : store_name
        tests:
          - not_null

  - name: inventory_silver
    columns:
      - name: store_id
        tests:
          - not_null
      - name : product_id
        tests:
          - not_null

      - name: stock
        tests:
          - positive_test:
              config:
                severity: warn

 
